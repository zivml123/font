<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#A8FF00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TRACKLIFE">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="TRACKLIFE — Tu mejor versión. Entrena, come bien y progresa.">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/views.css">

  <title>TRACKLIFE</title>

  <script>
    window.__SUPABASE_URL = '';
    window.__SUPABASE_KEY = '';
    window.__BASE = location.pathname.replace(/\/[^/]*$/, '/').replace(/\/$/, '') || '';
  </script>
</head>
<body>

<div id="loading-screen">
  <div class="splash-bg"></div>
  <div class="splash-content">
    <div class="splash-avatar-wrap">
      <img src="assets/brand.webp" alt="" class="splash-avatar-img" draggable="false">
    </div>
    <div class="splash-logo">-|- TRACKLIFE -|-</div>
    <div class="splash-sub">TU MEJOR VERSIÓN</div>
    <div class="splash-tagline">PLANEA HOY, <span class="splash-accent">PRESUME</span> MAÑANA.</div>
    <div class="splash-bar-wrap">
      <div class="splash-bar-label">CARGANDO DISCIPLINA...</div>
      <div class="splash-bar-track">
        <div class="splash-bar-fill"></div>
      </div>
    </div>
  </div>
</div>

<div id="auth-screen" class="auth-screen hidden"></div>
<div id="toast-container"></div>

<div id="main-app">

  <nav id="tab-bar" role="navigation" aria-label="Navegación principal">
    <button class="tab-btn active" data-tab="workout">
      <span class="tab-icon">🏋️</span>ENTRENA
    </button>
    <button class="tab-btn" data-tab="food">
      <span class="tab-icon">🥗</span>COME BIEN
    </button>
    <button class="tab-btn" data-tab="progress">
      <span class="tab-icon">📈</span>PROGRESA
    </button>
    <button class="tab-btn" data-tab="profile">
      <span class="tab-icon">🏆</span>SUPÉRATE
    </button>
  </nav>

  <div id="error-banner" class="hidden" role="alert">
    <span>Error</span>
    <button aria-label="Cerrar error">✕</button>
  </div>

  <main id="app">

    <div class="dash-header">
      <div class="dash-deco" aria-hidden="true"></div>
      <div class="dash-inner">
        <div class="dash-row">
          <div class="dash-brand">
            <div class="dash-brand-logo">-|- TRACKLIFE -|-</div>
            <div class="dash-brand-name" id="dash-name">—</div>
            <div class="dash-brand-date" id="dash-date">—</div>
          </div>
          <button class="dash-avatar" id="dash-avatar" aria-label="Foto de perfil" title="Cambiar foto">
            <img id="dash-avatar-img" class="dash-avatar-img" src="assets/brand.webp" alt="avatar">
            <span id="dash-avatar-initials" class="dash-avatar-initials hidden">TL</span>
            <div class="dash-avatar-badge">✎</div>
          </button>
        </div>
        <div class="dash-pills" id="dash-pills">
          <span class="dash-pill" id="dash-pill-weight">79.8 → 74.8 kg</span>
          <span class="dash-pill accent" id="dash-pill-fat">18.7% → 15% grasa</span>
          <span class="dash-pill" id="dash-pill-prot">175g prot/día</span>
        </div>
        <div class="dash-today">
          <div class="dash-today-item">
            <span class="dash-today-val accent" id="dash-kcal-val">—</span>
            <span class="dash-today-lbl">kcal hoy</span>
          </div>
          <div class="dash-today-item">
            <span class="dash-today-val gold" id="dash-prot-val">—</span>
            <span class="dash-today-lbl">proteína</span>
          </div>
          <div class="dash-today-item">
            <span class="dash-today-val" id="dash-workout-val">—</span>
            <span class="dash-today-lbl">entreno</span>
          </div>
        </div>
      </div>
    </div>

    <div id="workout-view" class="view active" role="tabpanel">
      <div style="padding:40px;text-align:center;color:var(--muted);">Cargando entrenos...</div>
    </div>
    <div id="food-view" class="view" role="tabpanel">
      <div style="padding:40px;text-align:center;color:var(--muted);">Cargando comidas...</div>
    </div>
    <div id="progress-view" class="view" role="tabpanel">
      <div style="padding:40px;text-align:center;color:var(--muted);">Cargando progreso...</div>
    </div>
    <div id="profile-view" class="view" role="tabpanel">
      <div style="padding:40px;text-align:center;color:var(--muted);">Cargando perfil...</div>
    </div>

  </main>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
