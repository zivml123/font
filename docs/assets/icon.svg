<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E0C06"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Top accent stripe -->
  <rect width="512" height="14" fill="#FF4D1C"/>
  <!-- Z letterform (top bar + diagonal + bottom bar merged) -->
  <!-- Top horizontal bar -->
  <rect x="72" y="88" width="368" height="80" rx="6" fill="#FF4D1C"/>
  <!-- Diagonal band: parallelogram -->
  <polygon points="300,168 440,168 212,344 72,344" fill="#FF4D1C"/>
  <!-- Bottom horizontal bar -->
  <rect x="72" y="344" width="368" height="80" rx="6" fill="#FF4D1C"/>
  <!-- Accent dot -->
  <circle cx="436" cy="436" r="18" fill="#ECECEC" opacity="0.5"/>
</svg>
