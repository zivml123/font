<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calzame AI — Zona Libre de Colón</title>
  <link rel="stylesheet" href="styles/calzame.css">
</head>
<body>

<div id="app">

  <!-- ── SIDEBAR ──────────────────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="brand">Calzame <span>AI</span></div>
      <div class="version">v1 · Zona Libre, Panamá</div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Principal</div>
      <button class="nav-item" data-view="dashboard">
        <span class="nav-icon">📊</span> Dashboard
      </button>
      <button class="nav-item" data-view="prospectos">
        <span class="nav-icon">👥</span> Prospectos
      </button>
      <button class="nav-item" data-view="seguimientos">
        <span class="nav-icon">📅</span> Seguimientos
        <span class="nav-badge" id="badge-seguimientos" style="display:none">0</span>
      </button>

      <div class="nav-section-label">Herramientas</div>
      <button class="nav-item" data-view="plantillas">
        <span class="nav-icon">📝</span> Plantillas
      </button>
      <button class="nav-item" data-view="importar">
        <span class="nav-icon">📂</span> Importar / Exportar
      </button>
    </nav>

    <div class="sidebar-footer">
      <div style="font-size:11px;color:var(--gray-600);line-height:1.6">
        Solo ventas mayoristas<br>
        Pedido mínimo US$5,000
      </div>
    </div>
  </aside>

  <!-- ── MAIN ─────────────────────────────────────────────────────────────── -->
  <main class="main">
    <header class="topbar">
      <span class="topbar-title">Dashboard</span>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="openAddProspecto()">+ Agregar Prospecto</button>
      </div>
    </header>

    <div class="content">
      <div id="view-content"><!-- rendered by router --></div>
    </div>
  </main>

</div>

<!-- ── TOAST ──────────────────────────────────────────────────────────────── -->
<div id="toast-container"></div>

<!-- ── MODAL: PROSPECTO ───────────────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-prospecto">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-prospecto-title">Agregar Prospecto</span>
      <button class="modal-close" onclick="Modal.close('modal-prospecto')">×</button>
    </div>
    <div class="modal-body" id="modal-prospecto-body"></div>
    <div class="modal-footer">
      <input type="hidden" id="modal-prospecto-id">
      <button class="btn btn-secondary" onclick="Modal.close('modal-prospecto')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveProspecto()">Guardar</button>
    </div>
  </div>
</div>

<!-- ── MODAL: DETALLE PROSPECTO ──────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-detail">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title">Detalle del Prospecto</span>
      <button class="modal-close" onclick="Modal.close('modal-detail')">×</button>
    </div>
    <div class="modal-body" id="modal-detail-body"></div>
  </div>
</div>

<!-- ── MODAL: SEGUIMIENTO ─────────────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-seguimiento">
  <div class="modal modal-sm">
    <div class="modal-header">
      <span class="modal-title" id="modal-seg-title">Agregar Seguimiento</span>
      <button class="modal-close" onclick="Modal.close('modal-seguimiento')">×</button>
    </div>
    <div class="modal-body" id="modal-seg-body"></div>
    <div class="modal-footer">
      <input type="hidden" id="modal-seg-id">
      <button class="btn btn-secondary" onclick="Modal.close('modal-seguimiento')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveSeguimiento()">Guardar</button>
    </div>
  </div>
</div>

<!-- ── MODAL: PLANTILLA ───────────────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-plantilla">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-tpl-title">Nueva Plantilla</span>
      <button class="modal-close" onclick="Modal.close('modal-plantilla')">×</button>
    </div>
    <div class="modal-body" id="modal-tpl-body"></div>
    <div class="modal-footer">
      <input type="hidden" id="modal-tpl-id">
      <button class="btn btn-secondary" onclick="Modal.close('modal-plantilla')">Cancelar</button>
      <button class="btn btn-primary" onclick="savePlantilla()">Guardar</button>
    </div>
  </div>
</div>

<!-- ── MODAL: CONFIRMAR ───────────────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal modal-sm">
    <div class="modal-header">
      <span class="modal-title">Confirmar acción</span>
      <button class="modal-close" onclick="Modal.close('modal-confirm')">×</button>
    </div>
    <div class="modal-body">
      <p class="confirm-msg" id="confirm-msg"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="Modal.close('modal-confirm')">Cancelar</button>
      <button class="btn btn-danger" id="confirm-ok">Eliminar</button>
    </div>
  </div>
</div>

<script src="src/calzame.js"></script>
</body>
</html>
